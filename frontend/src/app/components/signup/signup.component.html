<div class="signup-container">
  <h2>Register</h2>
  <p #errorRef class="error-text" id="login-error"></p>
  <form (submit)="onSubmit()">
    <div class="input-group">
      <label for="email">Email</label>
      <input type="email" id="email" [(ngModel)]="email" name="email" required (input)="clearError()" />
    </div>
    <div class="input-group">
      <label for="password">Password</label>
      <input type="password" id="password" [(ngModel)]="password" name="password" required (input)="clearError()" />
    </div>
    <div class="input-group">
      <label for="userName">username</label>
      <input type="text" id="userName" [(ngModel)]="userName" name="userName" required (input)="clearError()" />
    </div>
    <button type="submit" class="btn">Sign Up</button>
    <div class="login-link">
      Already have an account? <a routerLink="/login" routerLinkActive="active">Login here</a>
    </div>
  </form>
</div>
