<div class="login-container">
  <h2>Login</h2>
  <p #errorRef class="error-text" id="login-error"></p>
  <form (submit)="onSubmit()">
    <div class="input-group">
      <label for="email">Email</label>
      <input type="email" id="email" [(ngModel)]="email" name="email" required (input)="clearError()" />
    </div>
    <div class="input-group">
      <label for="password">Password</label>
      <input type="password" id="password" [(ngModel)]="password" name="password" required (input)="clearError()" />
    </div>
    <button type="submit" class="btn">Login</button>
    <div class="register-link">
      Don't have an account? <a routerLink="/signup" routerLinkActive="active">Register here</a>
    </div>
  </form>
</div>
